name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version must be at least 17, found $JAVA_MAJOR"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -s "$APK_PATH" ]; then
            echo "Verified APK exists and is non-empty at: $APK_PATH"
          else
            echo "Error: $APK_PATH is missing or empty. Searching app/build/outputs/apk..."
            find app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          ASSET_NAME="${REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          DEST_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "$DEST_DIR"
          DEST_PATH="${DEST_DIR}/${ASSET_NAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"
          echo "asset_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "RELEASE_ASSET_PATH=$DEST_PATH" >> "$GITHUB_ENV"
          echo "RELEASE_ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES=$(cat <<EOF
          Automated debug build for commit \`${GITHUB_SHA}\`.
          - Run Number: \`${GITHUB_RUN_NUMBER}\`
          - Attempt: \`${GITHUB_RUN_ATTEMPT}\`
          - Commit SHA: \`${GITHUB_SHA}\`
          - Note: For testing only. Signed with a temporary debug keystore.
          EOF
          )
          
          RELEASE_URL=$(gh release create "$TAG_NAME" \
            "${RELEASE_ASSET_PATH}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest)
          
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            TAG="${{ steps.publish_release.outputs.tag_name }}"
            TITLE="${{ steps.publish_release.outputs.release_title }}"
            URL="${{ steps.publish_release.outputs.release_url }}"
            ASSET="${{ steps.prepare_asset.outputs.asset_name }}"
            
            echo "Release created successfully!"
            echo "Tag: $TAG"
            echo "Title: $TITLE"
            echo "Release URL: $URL"
            echo "Asset Name: $ASSET"
            
            {
              echo "### 🚀 GitHub Release Created"
              echo "- **Title:** $TITLE"
              echo "- **Tag:** \`$TAG\`"
              echo "- **Release URL:** $URL"
              echo "- **Asset:** \`$ASSET\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Release publication did not succeed or was skipped, but the APK build succeeded and the 'app-debug-apk' artifact is available in the workflow run summary."
            {
              echo "### ⚠️ Release Notice"
              echo "The debug APK build succeeded! The artifact **app-debug-apk** is available for download in this workflow run's Summary artifacts section."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
